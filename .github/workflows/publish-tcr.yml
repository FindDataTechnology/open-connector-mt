name: Publish TCR Image

# open-connector-mt: build the upstream docker/Dockerfile and publish to
# Tencent TCR (hkccr.ccs.tencentyun.com/yizuo/open-connector-mt) so the
# fd-prod GitOps line (fd-infra-deploy, ArgoCD) can consume sha- tags.
#
# Requires repository secrets TCR_USERNAME / TCR_PASSWORD (same setup as the
# wanxing-* repositories). NOTE: runs are currently blocked by the org-level
# Actions policy for fork repositories; this workflow activates once the org
# allows Actions for this repo.
on:
  push:
    branches: [main]

concurrency:
  group: publish-tcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to TCR (hk + ccr)
        uses: docker/login-action@v3
        with:
          registry: hkccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login to TCR (ccr, direct — bypasses the hk→relay sync)
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push (hk)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            hkccr.ccs.tencentyun.com/yizuo/open-connector-mt:sha-${{ steps.meta.outputs.short }}
            hkccr.ccs.tencentyun.com/yizuo/open-connector-mt:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push same tags to ccr (Guangzhou, cluster-facing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ccr.ccs.tencentyun.com/yizuo/open-connector-mt:sha-${{ steps.meta.outputs.short }}
            ccr.ccs.tencentyun.com/yizuo/open-connector-mt:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
